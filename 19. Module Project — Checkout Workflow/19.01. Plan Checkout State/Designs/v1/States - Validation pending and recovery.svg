<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010"><g id="States - Validation pending and recovery"><rect x="0" y="0" width="1280" height="1010" rx="0" fill="#F7F6F2" stroke="none"/><text x="48" y="61" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">SHOPFRONT / CHECKOUT STATES</text><text x="48" y="113" font-family="Manrope" font-size="40" font-weight="700" fill="#19263A">Clear at every step.</text><text x="48" y="153" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">Keep useful details visible. Explain what the visitor can do next.</text><rect x="48" y="198" width="564" height="350" rx="16" fill="white" stroke="#DCE2E8"/><text x="74" y="234" font-family="DM Sans" font-size="10" font-weight="700" fill="#526277">VALIDATION</text><text x="74" y="281" font-family="Manrope" font-size="25" font-weight="700" fill="#19263A">Check your address.</text><g id="ZIP code"><text x="74" y="330" font-family="DM Sans" font-size="14" font-weight="600" fill="#526277">ZIP code</text><rect x="74" y="340" width="512" height="46" rx="9" fill="white" stroke="#943344"/><text x="87" y="369" font-family="DM Sans" font-size="15" font-weight="400" fill="#19263A">802</text><text x="74" y="409" font-family="DM Sans" font-size="13" font-weight="400" fill="#943344">Enter a five-digit ZIP code.</text></g><text x="74" y="466" font-family="DM Sans" font-size="15" font-weight="400" fill="#526277">Keep the entered name, email and street address available.</text><rect x="668" y="198" width="564" height="350" rx="16" fill="white" stroke="#DCE2E8"/><text x="694" y="234" font-family="DM Sans" font-size="10" font-weight="700" fill="#526277">PENDING</text><text x="694" y="281" font-family="Manrope" font-size="25" font-weight="700" fill="#19263A">Preparing your checkout.</text><text x="694" y="327" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Keep the form and summary visible while the request finishes.</text><g id="Preparing checkout…"><rect x="694" y="395" width="258" height="46" rx="10" fill="#E1E4E7" stroke="none"/><text x="754.897" y="424" font-family="DM Sans" font-size="14" font-weight="600" fill="#526277">Preparing checkout…</text></g><text x="694" y="486" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Quantity controls are temporarily unavailable.</text><rect x="48" y="591" width="564" height="350" rx="16" fill="white" stroke="#DCE2E8"/><text x="74" y="627" font-family="DM Sans" font-size="10" font-weight="700" fill="#526277">SERVER REJECTION</text><text x="74" y="674" font-family="Manrope" font-size="25" font-weight="700" fill="#19263A">Your draft is still here.</text><g id="Email address"><text x="74" y="723" font-family="DM Sans" font-size="14" font-weight="600" fill="#526277">Email address</text><rect x="74" y="733" width="512" height="46" rx="9" fill="white" stroke="#943344"/><text x="87" y="762" font-family="DM Sans" font-size="15" font-weight="400" fill="#19263A">blocked@example.com</text><text x="74" y="802" font-family="DM Sans" font-size="13" font-weight="400" fill="#943344">Use another email address for this checkout.</text></g><text x="74" y="861" font-family="DM Sans" font-size="15" font-weight="400" fill="#526277">Correct the email, then try again.</text><rect x="668" y="591" width="564" height="350" rx="16" fill="white" stroke="#DCE2E8"/><text x="694" y="627" font-family="DM Sans" font-size="10" font-weight="700" fill="#526277">UNSAVED CHANGES</text><text x="694" y="674" font-family="Manrope" font-size="25" font-weight="700" fill="#19263A">Leave without saving?</text><text x="694" y="723" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Your changes have not been saved.</text><g id="Keep editing"><rect x="694" y="768" width="175" height="46" rx="10" fill="#1E4C7C" stroke="none"/><text x="740.613" y="797" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Keep editing</text></g><g id="Discard changes and leave"><rect x="694" y="831" width="286" height="46" rx="10" fill="white" stroke="#7F8DA3"/><text x="749.4929999999999" y="860" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Discard changes and leave</text></g></g></svg>