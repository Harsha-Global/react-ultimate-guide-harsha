<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="810" viewBox="0 0 1280 810"><g id="States - Saved draft and empty bag"><rect x="0" y="0" width="1280" height="810" rx="0" fill="#F7F6F2" stroke="none"/><text x="48" y="80" font-family="Manrope" font-size="40" font-weight="700" fill="#19263A">Ready for the next step.</text><text x="48" y="122" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">A saved practice draft and an empty bag need different feedback.</text><rect x="48" y="180" width="560" height="469" rx="16" fill="#E7EEE7" stroke="#BCCFBD"/><text x="76" y="223" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">LAST PREPARED DRAFT</text><text x="76" y="276" font-family="Manrope" font-size="28" font-weight="700" fill="#19263A">Checkout draft prepared.</text><text x="76" y="322" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">We checked 2 items against the current catalog.</text><text x="76" y="404" font-family="DM Sans" font-size="16" font-weight="400" fill="#19263A">Item subtotal</text><text x="486" y="404" font-family="DM Sans" font-size="18" font-weight="650" fill="#19263A">$158.00</text><text x="76" y="452" font-family="DM Sans" font-size="16" font-weight="400" fill="#19263A">Delivery</text><text x="504" y="452" font-family="DM Sans" font-size="18" font-weight="650" fill="#19263A">$5.00</text><text x="76" y="522" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Tax is not calculated. Your bag is still available.</text><text x="76" y="601" font-family="DM Sans" font-size="13" font-weight="400" fill="#526277">Draft a1b2c3d4</text><g id="Empty bag"><rect x="664" y="180" width="568" height="324" rx="18" fill="white" stroke="#DCE2E8"/><text x="688" y="218" font-family="DM Sans" font-size="10" font-weight="700" fill="#526277">YOUR CONSIDERED CHOICES</text><text x="688" y="260" font-family="Manrope" font-size="24" font-weight="700" fill="#19263A">Order summary</text><text x="1154" y="260" font-family="DM Sans" font-size="13" font-weight="400" fill="#526277">0 items</text><rect x="688" y="288" width="520" height="1" rx="0" fill="#DCE2E8" stroke="none"/><text x="688" y="335" font-family="DM Sans" font-size="18" font-weight="400" fill="#19263A">Your bag is empty.</text><g id="Explore the collection"><rect x="688" y="366" width="520" height="46" rx="10" fill="#1E4C7C" stroke="none"/><text x="876.992" y="395" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Explore the collection</text></g></g><text x="688" y="618" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">The Prepare checkout button stays unavailable until the bag has</text><text x="688" y="642" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">valid items.</text></g></svg>