<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980"><g id="06 - Tokens Fonts and Controls"><rect x="0" y="0" width="1280" height="980" rx="0" fill="#F7F6F2" stroke="none"/><text x="48" y="77" font-family="Manrope" font-size="34" font-weight="700" fill="#19263A">ShopFront design system</text><text x="48" y="126" font-family="DM Sans" font-size="19" font-weight="400" fill="#526277">Manrope headings / DM Sans body / local licensed font files</text><rect x="48" y="181" width="207" height="90" rx="14" fill="#19263A" stroke="#DCE2E8"/><text x="48" y="310" font-family="DM Sans" font-size="16" font-weight="600" fill="#19263A">Ink</text><text x="48" y="340" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">#19263A</text><rect x="289" y="181" width="207" height="90" rx="14" fill="#F7F6F2" stroke="#DCE2E8"/><text x="289" y="310" font-family="DM Sans" font-size="16" font-weight="600" fill="#19263A">Page</text><text x="289" y="340" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">#F7F6F2</text><rect x="530" y="181" width="207" height="90" rx="14" fill="#1E4C7C" stroke="#DCE2E8"/><text x="530" y="310" font-family="DM Sans" font-size="16" font-weight="600" fill="#19263A">Primary</text><text x="530" y="340" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">#1E4C7C</text><rect x="771" y="181" width="207" height="90" rx="14" fill="#8C275D" stroke="#DCE2E8"/><text x="771" y="310" font-family="DM Sans" font-size="16" font-weight="600" fill="#19263A">Accent</text><text x="771" y="340" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">#8C275D</text><rect x="1012" y="181" width="207" height="90" rx="14" fill="#DCE2E8" stroke="#DCE2E8"/><text x="1012" y="310" font-family="DM Sans" font-size="16" font-weight="600" fill="#19263A">Border</text><text x="1012" y="340" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">#DCE2E8</text><text x="48" y="419" font-family="Manrope" font-size="27" font-weight="700" fill="#19263A">One familiar control language</text><g id="Control - Shortlist item"><rect x="48" y="461" width="245" height="46" rx="10" fill="#1E4C7C" stroke="#1E4C7C"/><text x="126.372" y="490" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Shortlist item</text></g><g id="Control - Remove from shortlist"><rect x="320" y="461" width="245" height="46" rx="10" fill="white" stroke="#1E4C7C"/><text x="369.83299999999997" y="490" font-family="DM Sans" font-size="14" font-weight="600" fill="#1E4C7C">Remove from shortlist</text></g><rect x="593" y="457" width="257" height="54" rx="13" fill="none" stroke="#8C275D"/><g id="Control - Keyboard focus"><rect x="597" y="461" width="249" height="46" rx="10" fill="white" stroke="#1E4C7C"/><text x="669.812" y="490" font-family="DM Sans" font-size="14" font-weight="600" fill="#1E4C7C">Keyboard focus</text></g><g id="Field - Search products"><text x="48" y="589" font-family="DM Sans" font-size="13" font-weight="500" fill="#526277">Search products</text><rect x="48" y="599" width="512" height="46" rx="9" fill="white" stroke="#7F8DA3"/><text x="62" y="629" font-family="DM Sans" font-size="15" font-weight="400" fill="#19263A">studio</text></g><g id="Field - Category"><text x="593" y="589" font-family="DM Sans" font-size="13" font-weight="500" fill="#526277">Category</text><rect x="593" y="599" width="256" height="46" rx="9" fill="white" stroke="#7F8DA3"/><text x="607" y="629" font-family="DM Sans" font-size="15" font-weight="400" fill="#19263A">Workspace</text></g><g id="Field - Sort"><text x="884" y="589" font-family="DM Sans" font-size="13" font-weight="500" fill="#526277">Sort</text><rect x="884" y="599" width="299" height="46" rx="9" fill="white" stroke="#7F8DA3"/><text x="898" y="629" font-family="DM Sans" font-size="15" font-weight="400" fill="#19263A">Price: low to high</text></g><text x="48" y="713" font-family="DM Sans" font-size="18" font-weight="400" fill="#526277">Warm surfaces, deliberate product photography, visible focus, clear availability labels and a consistent shortlist owner. Reflow the grid</text><text x="48" y="738" font-family="DM Sans" font-size="18" font-weight="400" fill="#526277">from four columns to two and one; stack details at narrow widths.</text><text x="48" y="837" font-family="DM Sans" font-size="18" font-weight="600" fill="#19263A">Spacing: 8 / 12 / 16 / 24 / 32 / 48 / 64 px</text><text x="48" y="881" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Controls: at least 44px high. Motion respects reduced-motion preferences.</text><text x="48" y="931" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Original course product images and font license/source records accompany the source.</text></g></svg>