<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1000" viewBox="0 0 1440 1000"><g id="01 - Customer orders - Desktop"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F7F6F2" stroke="#F7F6F2"/><text x="48" y="43" font-family="Manrope" font-size="24" font-weight="700" fill="#19263A">ShopFront.</text><text x="925" y="42" font-family="DM Sans" font-size="14" font-weight="600" fill="#1E4C7C">Collection    Our story    Delivery    Shortlist (0)    Account</text><rect x="48" y="80" width="1344" height="1" rx="0" fill="#DCE2E8" stroke="#DCE2E8"/><text x="48" y="137" font-family="DM Sans" font-size="12" font-weight="700" fill="#8C275D">CUSTOMER SPACE</text><text x="48" y="198" font-family="Manrope" font-size="44" font-weight="700" fill="#19263A">Your orders</text><text x="48" y="240" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">Your 20 most recent orders. Only your account can open these details.</text><rect x="48" y="285" width="842" height="345" rx="12" fill="white" stroke="#DCE2E8"/><text x="76" y="328" font-family="DM Sans" font-size="12" font-weight="700" fill="#8C275D">PAYMENT VERIFIED</text><text x="76" y="374" font-family="Manrope" font-size="28" font-weight="700" fill="#19263A">O-1001</text><text x="76" y="421" font-family="DM Sans" font-size="18" font-weight="400" fill="#19263A">Studio Desk Lamp × 1</text><text x="794" y="421" font-family="DM Sans" font-size="18" font-weight="400" fill="#19263A">$89.00</text><text x="76" y="462" font-family="DM Sans" font-size="18" font-weight="400" fill="#19263A">Terracotta Travel Mug × 2</text><text x="794" y="462" font-family="DM Sans" font-size="18" font-weight="400" fill="#19263A">$56.00</text><rect x="76" y="490" width="784" height="1" rx="0" fill="#DCE2E8" stroke="#DCE2E8"/><text x="76" y="541" font-family="Manrope" font-size="22" font-weight="700" fill="#19263A">Total</text><text x="760" y="541" font-family="Manrope" font-size="24" font-weight="700" fill="#19263A">$145.00</text><g id="Button - Open your order"><rect x="76" y="566" width="178" height="44" rx="10" fill="#1E4C7C" stroke="#1E4C7C"/><text x="106.9875" y="594" font-family="DM Sans" font-size="15" font-weight="600" fill="white">Open your order</text></g><rect x="926" y="285" width="466" height="150" rx="12" fill="white" stroke="#DCE2E8"/><text x="948" y="322" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">A clear next step</text><text x="948" y="361" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Payment and background work have separate states.</text><text x="948" y="386" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Your order shows what is saved and what is still</text><text x="948" y="411" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">processing.</text><rect x="926" y="462" width="466" height="150" rx="12" fill="white" stroke="#DCE2E8"/><text x="948" y="499" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">Private by default</text><text x="948" y="538" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Opening a direct order address still checks the current</text><text x="948" y="563" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">customer. Another account receives an unavailable</text><text x="948" y="588" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">message.</text><text x="48" y="720" font-family="DM Sans" font-size="12" font-weight="700" fill="#8C275D">REPRESENTATIVE ORDER STATES</text><rect x="48" y="748" width="424" height="150" rx="12" fill="white" stroke="#DCE2E8"/><text x="70" y="785" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">Awaiting payment</text><text x="70" y="824" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Continue the existing order. A return address</text><text x="70" y="849" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">alone is not proof of payment.</text><rect x="508" y="748" width="424" height="150" rx="12" fill="white" stroke="#DCE2E8"/><text x="530" y="785" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">Receipt processing</text><text x="530" y="824" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Payment is verified; the durable background job is</text><text x="530" y="849" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">still completing.</text><rect x="968" y="748" width="424" height="150" rx="12" fill="white" stroke="#DCE2E8"/><text x="990" y="785" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">Receipt ready</text><text x="990" y="824" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Show the saved receipt total and a clear link to</text><text x="990" y="849" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">the owned order.</text></g></svg>