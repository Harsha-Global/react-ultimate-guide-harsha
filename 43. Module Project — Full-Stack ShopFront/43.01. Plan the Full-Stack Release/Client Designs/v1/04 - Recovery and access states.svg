<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1000" viewBox="0 0 1440 1000"><g id="04 - Recovery and access states"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F7F6F2" stroke="#DCE2E8"/><text x="48" y="59" font-family="DM Sans" font-size="12" font-weight="700" fill="#8C275D">SHOPFRONT / RECOVERY &amp; ACCESS</text><text x="48" y="112" font-family="Manrope" font-size="42" font-weight="700" fill="#19263A">Keep the next action clear.</text><rect x="48" y="180" width="654" height="150" rx="12" fill="white" stroke="#DCE2E8"/><text x="70" y="217" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">Signed out</text><text x="70" y="256" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Please sign in. Open your account before requesting a private order.</text><rect x="738" y="180" width="654" height="150" rx="12" fill="white" stroke="#DCE2E8"/><text x="760" y="217" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">Wrong workspace</text><text x="760" y="256" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Workspace not found. A filter or guessed order address never grants</text><text x="760" y="281" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">membership.</text><rect x="48" y="430" width="654" height="150" rx="12" fill="white" stroke="#DCE2E8"/><text x="70" y="467" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">Stock conflict</text><text x="70" y="506" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Stock changed or editing is unavailable. Keep the draft, then refresh to review.</text><rect x="738" y="430" width="654" height="150" rx="12" fill="white" stroke="#DCE2E8"/><text x="760" y="467" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">Uncertain order result</text><text x="760" y="506" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Retry this same order attempt, or check Your orders. Keep its request key.</text><rect x="48" y="680" width="654" height="150" rx="12" fill="white" stroke="#DCE2E8"/><text x="70" y="717" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">Upload failed</text><text x="70" y="756" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">The upload could not be confirmed. Restore the service and retry the disposable</text><text x="70" y="781" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">image.</text><rect x="738" y="680" width="654" height="150" rx="12" fill="white" stroke="#DCE2E8"/><text x="760" y="717" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">Receipt pending</text><text x="760" y="756" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Payment is verified; the job is still processing. The receipt total appears after it is</text><text x="760" y="781" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">saved.</text></g></svg>