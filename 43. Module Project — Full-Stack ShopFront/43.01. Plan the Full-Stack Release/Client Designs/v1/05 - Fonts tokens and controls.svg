<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1000" viewBox="0 0 1440 1000"><g id="05 - Fonts tokens and controls"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F7F6F2" stroke="#DCE2E8"/><text x="48" y="84" font-family="Manrope" font-size="42" font-weight="700" fill="#19263A">ShopFront design system</text><text x="48" y="131" font-family="DM Sans" font-size="18" font-weight="400" fill="#526277">Manrope headings · DM Sans body · local font files and OFL licenses</text><text x="48" y="220" font-family="Manrope" font-size="36" font-weight="700" fill="#19263A">A useful everyday collection.</text><text x="48" y="268" font-family="DM Sans" font-size="22" font-weight="400" fill="#19263A">Private orders, clear states and dependable recovery.</text><rect x="48" y="332" width="204" height="112" rx="12" fill="#F7F6F2" stroke="#DCE2E8"/><text x="48" y="479" font-family="DM Sans" font-size="17" font-weight="600" fill="#19263A">Page</text><text x="48" y="514" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">#F7F6F2</text><rect x="276" y="332" width="204" height="112" rx="12" fill="#19263A" stroke="#DCE2E8"/><text x="276" y="479" font-family="DM Sans" font-size="17" font-weight="600" fill="#19263A">Ink</text><text x="276" y="514" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">#19263A</text><rect x="504" y="332" width="204" height="112" rx="12" fill="#1E4C7C" stroke="#DCE2E8"/><text x="504" y="479" font-family="DM Sans" font-size="17" font-weight="600" fill="#19263A">Primary</text><text x="504" y="514" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">#1E4C7C</text><rect x="732" y="332" width="204" height="112" rx="12" fill="#8C275D" stroke="#DCE2E8"/><text x="732" y="479" font-family="DM Sans" font-size="17" font-weight="600" fill="#19263A">Accent</text><text x="732" y="514" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">#8C275D</text><rect x="960" y="332" width="204" height="112" rx="12" fill="#526277" stroke="#DCE2E8"/><text x="960" y="479" font-family="DM Sans" font-size="17" font-weight="600" fill="#19263A">Secondary</text><text x="960" y="514" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">#526277</text><rect x="1188" y="332" width="204" height="112" rx="12" fill="#DCE2E8" stroke="#DCE2E8"/><text x="1188" y="479" font-family="DM Sans" font-size="17" font-weight="600" fill="#19263A">Border</text><text x="1188" y="514" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">#DCE2E8</text><text x="48" y="600" font-family="Manrope" font-size="28" font-weight="700" fill="#19263A">Reusable controls</text><g id="Button - Reserve order"><rect x="48" y="641" width="192" height="44" rx="10" fill="#1E4C7C" stroke="#1E4C7C"/><text x="94.71000000000001" y="669" font-family="DM Sans" font-size="15" font-weight="600" fill="white">Reserve order</text></g><g id="Button - Save stock"><rect x="264" y="641" width="192" height="44" rx="10" fill="white" stroke="#7F8DA3"/><text x="321.675" y="669" font-family="DM Sans" font-size="15" font-weight="600" fill="#1E4C7C">Save stock</text></g><text x="488" y="627" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Quantity</text><rect x="488" y="639" width="300" height="44" rx="10" fill="white" stroke="#7F8DA3"/><text x="501" y="667" font-family="DM Sans" font-size="16" font-weight="400" fill="#19263A">1</text><rect x="834" y="637" width="206" height="52" rx="12" fill="none" stroke="#8C275D"/><g id="Button - Keyboard focus"><rect x="838" y="641" width="198" height="44" rx="10" fill="white" stroke="#7F8DA3"/><text x="881.62" y="669" font-family="DM Sans" font-size="15" font-weight="600" fill="#1E4C7C">Keyboard focus</text></g><text x="48" y="790" font-family="DM Sans" font-size="20" font-weight="400" fill="#19263A">Spacing 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64</text><text x="48" y="834" font-family="DM Sans" font-size="20" font-weight="400" fill="#19263A">44px control targets · visible focus · status text alongside color</text><text x="48" y="878" font-family="DM Sans" font-size="20" font-weight="400" fill="#19263A">Desktop: split inventory/queue. Mobile: stack in reading order.</text><text x="48" y="922" font-family="DM Sans" font-size="15" font-weight="400" fill="#526277">Prepared reference design. Author-reviewed implementation is supplied separately.</text></g></svg>