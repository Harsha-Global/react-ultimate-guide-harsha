name: Full-stack checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: full-stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: course
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: shopfront_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U course -d shopfront_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://course:disposable-ci-only@127.0.0.1:5432/shopfront_test
      DIRECT_URL: postgresql://course:disposable-ci-only@127.0.0.1:5432/shopfront_test
      TEST_DATABASE_URL: postgresql://course:disposable-ci-only@127.0.0.1:5432/shopfront_test
      BETTER_AUTH_SECRET: disposable-ci-secret-not-for-deployment
      BETTER_AUTH_URL: http://127.0.0.1:3140
      COURSE_ALLOW_WRITES: disabled
      INNGEST_DEV: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run test:unit
      - run: npm run test:database
      - run: npm run test:auth
      - run: npm run test:orders
      - run: npm run test:security
      - run: npm run test:workflows
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          path: playwright-report/
          retention-days: 3
