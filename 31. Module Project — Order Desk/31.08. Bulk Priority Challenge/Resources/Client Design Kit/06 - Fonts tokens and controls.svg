<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980"><g id="06 - Fonts tokens and controls"><rect x="0" y="0" width="1280" height="980" rx="0" fill="#F7F6F2" stroke="none"/><text x="48" y="83" font-family="Manrope" font-size="36" font-weight="700" fill="#19263A">Order Desk design system</text><text x="48" y="125" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">Local fonts, practical spacing and familiar controls.</text><text x="48" y="201" font-family="Manrope" font-size="30" font-weight="700" fill="#19263A">Manrope / headings</text><text x="48" y="244" font-family="DM Sans" font-size="19" font-weight="400" fill="#19263A">DM Sans / body, controls and numbers</text><text x="48" y="281" font-family="DM Sans" font-size="18" font-weight="400" fill="#19263A">OD-1041   $158.00   version 2</text><text x="48" y="314" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Font files and OFL licenses are supplied with the kit.</text><rect x="48" y="360" width="175" height="98" rx="12" fill="#19263A" stroke="#DCE2E8"/><text x="48" y="483" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Ink</text><text x="48" y="508" font-family="DM Sans" font-size="13" font-weight="400" fill="#526277">#19263A</text><rect x="247" y="360" width="175" height="98" rx="12" fill="#F7F6F2" stroke="#DCE2E8"/><text x="247" y="483" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Page</text><text x="247" y="508" font-family="DM Sans" font-size="13" font-weight="400" fill="#526277">#F7F6F2</text><rect x="446" y="360" width="175" height="98" rx="12" fill="#1E4C7C" stroke="#DCE2E8"/><text x="446" y="483" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Primary blue</text><text x="446" y="508" font-family="DM Sans" font-size="13" font-weight="400" fill="#526277">#1E4C7C</text><rect x="645" y="360" width="175" height="98" rx="12" fill="#4D3865" stroke="#DCE2E8"/><text x="645" y="483" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Action plum</text><text x="645" y="508" font-family="DM Sans" font-size="13" font-weight="400" fill="#526277">#4D3865</text><rect x="844" y="360" width="175" height="98" rx="12" fill="#8C275D" stroke="#DCE2E8"/><text x="844" y="483" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Focus magenta</text><text x="844" y="508" font-family="DM Sans" font-size="13" font-weight="400" fill="#526277">#8C275D</text><rect x="1043" y="360" width="175" height="98" rx="12" fill="#DCE2E8" stroke="#DCE2E8"/><text x="1043" y="483" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Border</text><text x="1043" y="508" font-family="DM Sans" font-size="13" font-weight="400" fill="#526277">#DCE2E8</text><text x="48" y="578" font-family="Manrope" font-size="27" font-weight="700" fill="#19263A">Reusable controls</text><g id="Button - Apply filters"><rect x="48" y="620" width="216" height="44" rx="8" fill="#4D3865" stroke="#4D3865"/><text x="116.38" y="648" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Apply filters</text></g><g id="Button - Refresh queue"><rect x="288" y="620" width="216" height="44" rx="8" fill="white" stroke="#7F8DA3"/><text x="348.764" y="648" font-family="DM Sans" font-size="14" font-weight="600" fill="#1E4C7C">Refresh queue</text></g><g id="Button - Save status"><rect x="528" y="620" width="216" height="44" rx="8" fill="#D8D2DF" stroke="#D8D2DF"/><text x="597.682" y="648" font-family="DM Sans" font-size="14" font-weight="600" fill="#526277">Save status</text></g><rect x="768" y="616" width="228" height="52" rx="10" fill="none" stroke="#8C275D"/><g id="Button - Keyboard focus"><rect x="772" y="620" width="220" height="44" rx="8" fill="white" stroke="#7F8DA3"/><text x="830.312" y="648" font-family="DM Sans" font-size="14" font-weight="600" fill="#1E4C7C">Keyboard focus</text></g><g id="Field - Search orders"><text x="48" y="724" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Search orders</text><rect x="48" y="734" width="380" height="44" rx="8" fill="white" stroke="#AEB7C3"/><text x="60" y="762" font-family="DM Sans" font-size="14" font-weight="400" fill="#19263A">Avery</text></g><g id="Field - Order status"><text x="456" y="724" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Order status</text><rect x="456" y="734" width="350" height="44" rx="8" fill="white" stroke="#AEB7C3"/><text x="468" y="762" font-family="DM Sans" font-size="14" font-weight="400" fill="#19263A">Ready to pack</text></g><text x="48" y="854" font-family="DM Sans" font-size="16" font-weight="400" fill="#19263A">44px control targets · 3px focus outline · 8–16px corners</text><text x="48" y="892" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Status colors always accompany text. Mobile tables retain horizontal scroll.</text><text x="48" y="928" font-family="DM Sans" font-size="15" font-weight="400" fill="#526277">Selections are temporary. Only validated display preferences are saved locally.</text></g></svg>