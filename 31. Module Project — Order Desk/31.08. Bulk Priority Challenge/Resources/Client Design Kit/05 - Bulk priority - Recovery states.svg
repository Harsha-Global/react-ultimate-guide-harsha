<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="870" viewBox="0 0 1280 870"><g id="05 - Bulk priority - Recovery states"><rect x="0" y="0" width="1280" height="870" rx="0" fill="#F7F6F2" stroke="none"/><text x="48" y="55" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">ORDER DESK / CLIENT CHANGE A07</text><text x="48" y="108" font-family="Manrope" font-size="36" font-weight="700" fill="#19263A">Protect a recoverable attempt.</text><text x="48" y="150" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">A draft, a pending request and its eventual result belong to a specific workspace.</text><rect x="48" y="208" width="574" height="260" rx="16" fill="white" stroke="#DCE2E8"/><text x="72" y="253" font-family="Manrope" font-size="25" font-weight="700" fill="#19263A">Selection changed</text><text x="72" y="296" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">A new order was selected after review. Review the current</text><text x="72" y="321" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">selection before applying.</text><g id="Button - Review selected priorities"><rect x="72" y="386" width="294" height="44" rx="8" fill="#4D3865" stroke="#4D3865"/><text x="134.433" y="414" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Review selected priorities</text></g><rect x="658" y="208" width="574" height="260" rx="16" fill="white" stroke="#DCE2E8"/><text x="682" y="253" font-family="Manrope" font-size="25" font-weight="700" fill="#19263A">Whole request failed</text><text x="682" y="296" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">Keep every selected ID. Explain the request error so the operator</text><text x="682" y="321" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">can recover.</text><g id="Button - Apply high priority"><rect x="682" y="386" width="294" height="44" rx="8" fill="#4D3865" stroke="#4D3865"/><text x="768.422" y="414" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Apply high priority</text></g><rect x="48" y="508" width="574" height="260" rx="16" fill="white" stroke="#DCE2E8"/><text x="72" y="553" font-family="Manrope" font-size="25" font-weight="700" fill="#19263A">Viewer session</text><text x="72" y="596" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">The selected orders may be reviewed, but this session cannot</text><text x="72" y="621" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">change their priority.</text><g id="Button - Apply high priority"><rect x="72" y="686" width="294" height="44" rx="8" fill="#D8D2DF" stroke="#D8D2DF"/><text x="158.422" y="714" font-family="DM Sans" font-size="14" font-weight="600" fill="#526277">Apply high priority</text></g><rect x="658" y="508" width="574" height="260" rx="16" fill="white" stroke="#DCE2E8"/><text x="682" y="553" font-family="Manrope" font-size="25" font-weight="700" fill="#19263A">Workspace changed</text><text x="682" y="596" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">Ignore the old batch result. Keep the newly opened workspace</text><text x="682" y="621" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">and its selection intact.</text><g id="Button - Open South"><rect x="682" y="686" width="294" height="44" rx="8" fill="#4D3865" stroke="#4D3865"/><text x="790.297" y="714" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Open South</text></g></g></svg>