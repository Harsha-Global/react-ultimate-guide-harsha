<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000"><g id="04 - Bulk priority - Review and results"><rect x="0" y="0" width="1280" height="1000" rx="0" fill="#F7F6F2" stroke="none"/><text x="48" y="55" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">ORDER DESK / CLIENT CHANGE A07</text><text x="48" y="109" font-family="Manrope" font-size="36" font-weight="700" fill="#19263A">Set priority. Keep every result.</text><text x="48" y="153" font-family="DM Sans" font-size="18" font-weight="400" fill="#526277">Review selected orders across pages, apply one priority and retain the orders that need attention.</text><text x="48" y="204" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">BEFORE APPLYING</text><rect x="48" y="220" width="1184" height="285" rx="16" fill="white" stroke="#DCE2E8"/><text x="72" y="260" font-family="Manrope" font-size="24" font-weight="700" fill="#19263A">Bulk order priority</text><text x="72" y="298" font-family="DM Sans" font-size="15" font-weight="400" fill="#526277">2 selected records reviewed</text><g id="Button - Review selected priorities"><rect x="72" y="325" width="246" height="44" rx="8" fill="#4D3865" stroke="#4D3865"/><text x="110.433" y="353" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Review selected priorities</text></g><text x="72" y="409" font-family="DM Sans" font-size="17" font-weight="400" fill="#19263A">OD-1041: normal · version 1</text><text x="72" y="448" font-family="DM Sans" font-size="17" font-weight="400" fill="#19263A">OD-1042: normal · version 1</text><g id="Button - Apply high priority"><rect x="878" y="325" width="282" height="44" rx="8" fill="#4D3865" stroke="#4D3865"/><text x="958.422" y="353" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Apply high priority</text></g><text x="878" y="411" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">The request uses the versions captured</text><text x="878" y="436" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">during review.</text><text x="48" y="528" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">AFTER THE RESPONSE</text><rect x="48" y="542" width="758" height="290" rx="16" fill="white" stroke="#DCE2E8"/><text x="72" y="581" font-family="Manrope" font-size="24" font-weight="700" fill="#19263A">Batch results</text><rect x="72" y="609" width="710" height="72" rx="10" fill="#EDF6EE" stroke="none"/><text x="93" y="640" font-family="DM Sans" font-size="17" font-weight="700" fill="#25633C">OD-1041 accepted</text><text x="93" y="665" font-family="DM Sans" font-size="14" font-weight="400" fill="#25633C">Priority: high · version 2</text><rect x="72" y="704" width="710" height="88" rx="10" fill="#FFF3DB" stroke="none"/><text x="93" y="735" font-family="DM Sans" font-size="17" font-weight="700" fill="#805300">OD-1042 rejected</text><text x="93" y="765" font-family="DM Sans" font-size="14" font-weight="400" fill="#805300">Payment pending: ready orders only.</text><g id="Selection summary"><rect x="846" y="542" width="386" height="330" rx="16" fill="white" stroke="#DCE2E8"/><rect x="847" y="543" width="384" height="4" rx="2" fill="#8C275D" stroke="none"/><text x="870" y="582" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">CURRENT WORKSPACE</text><text x="870" y="617" font-family="Manrope" font-size="24" font-weight="700" fill="#19263A">Selection</text><text x="870" y="686" font-family="Manrope" font-size="50" font-weight="700" fill="#19263A">1</text><text x="870" y="719" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">orders selected across searches</text><text x="870" y="775" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">The service validates readiness when you prepare</text><text x="870" y="800" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">a preview.</text><g id="Button - Clear selection"><rect x="870" y="807" width="338" height="44" rx="8" fill="white" stroke="#7F8DA3"/><text x="990.1610000000001" y="835" font-family="DM Sans" font-size="14" font-weight="600" fill="#1E4C7C">Clear selection</text></g></g><text x="48" y="925" font-family="DM Sans" font-size="18" font-weight="400" fill="#526277">The accepted order leaves the selection. The rejected order and any new selections remain. Review again before the next attempt.</text></g></svg>