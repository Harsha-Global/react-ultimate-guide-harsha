<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1110" viewBox="0 0 1280 1110"><g id="03 - Guided workspace - Recovery states"><rect x="0" y="0" width="1280" height="1110" rx="0" fill="#F7F6F2" stroke="none"/><text x="48" y="55" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">ORDER DESK / GUIDED STATES</text><text x="48" y="104" font-family="Manrope" font-size="36" font-weight="700" fill="#19263A">Keep the next action clear.</text><text x="48" y="141" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">The queue, session and editor explain what the operator can do.</text><rect x="48" y="190" width="574" height="256" rx="16" fill="white" stroke="#DCE2E8"/><text x="72" y="232" font-family="Manrope" font-size="24" font-weight="700" fill="#19263A">Queue loading</text><rect x="72" y="257" width="526" height="86" rx="9" fill="#F0F4FA" stroke="none"/><text x="87" y="288" font-family="DM Sans" font-size="15" font-weight="600" fill="#19263A">Waiting for this result.</text><text x="87" y="315" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Loading queue…</text><text x="72" y="384" font-family="DM Sans" font-size="15" font-weight="400" fill="#526277">Refresh stays disabled while fetching.</text><rect x="658" y="190" width="574" height="256" rx="16" fill="white" stroke="#DCE2E8"/><text x="682" y="232" font-family="Manrope" font-size="24" font-weight="700" fill="#19263A">No matching orders</text><rect x="682" y="257" width="526" height="86" rx="9" fill="#F0F4FA" stroke="none"/><text x="697" y="288" font-family="DM Sans" font-size="15" font-weight="600" fill="#19263A">Page 1 - 0 matching orders</text><text x="697" y="315" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">No orders on this page.</text><text x="682" y="384" font-family="DM Sans" font-size="15" font-weight="400" fill="#526277">Change the filters or return to an earlier page.</text><rect x="48" y="478" width="574" height="256" rx="16" fill="white" stroke="#DCE2E8"/><text x="72" y="520" font-family="Manrope" font-size="24" font-weight="700" fill="#19263A">Request failure</text><rect x="72" y="545" width="526" height="86" rx="9" fill="#FFF0F0" stroke="none"/><text x="87" y="576" font-family="DM Sans" font-size="15" font-weight="600" fill="#19263A">The API could not be reached.</text><text x="87" y="603" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Your selection stays available.</text><text x="72" y="672" font-family="DM Sans" font-size="15" font-weight="400" fill="#526277">Start the API, then click Refresh queue.</text><rect x="658" y="478" width="574" height="256" rx="16" fill="white" stroke="#DCE2E8"/><text x="682" y="520" font-family="Manrope" font-size="24" font-weight="700" fill="#19263A">Viewer session</text><rect x="682" y="545" width="526" height="86" rx="9" fill="#F5F1F7" stroke="none"/><text x="697" y="576" font-family="DM Sans" font-size="15" font-weight="600" fill="#19263A">Current session: viewer</text><text x="697" y="603" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">This session cannot change fulfillment.</text><text x="682" y="672" font-family="DM Sans" font-size="15" font-weight="400" fill="#526277">Read the orders; open an operator session to edit.</text><rect x="48" y="766" width="574" height="256" rx="16" fill="white" stroke="#DCE2E8"/><text x="72" y="808" font-family="Manrope" font-size="24" font-weight="700" fill="#19263A">Outdated editor</text><rect x="72" y="833" width="526" height="86" rx="9" fill="#FFF3DB" stroke="none"/><text x="87" y="864" font-family="DM Sans" font-size="15" font-weight="600" fill="#19263A">A newer version is available.</text><text x="87" y="891" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Reload before saving.</text><text x="72" y="960" font-family="DM Sans" font-size="15" font-weight="400" fill="#526277">Do not overwrite a record you have not reviewed.</text><rect x="658" y="766" width="574" height="256" rx="16" fill="white" stroke="#DCE2E8"/><text x="682" y="808" font-family="Manrope" font-size="24" font-weight="700" fill="#19263A">Invalid fulfillment</text><rect x="682" y="833" width="526" height="86" rx="9" fill="#FFF3DB" stroke="none"/><text x="697" y="864" font-family="DM Sans" font-size="15" font-weight="600" fill="#19263A">Payment is still pending.</text><text x="697" y="891" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">The service rejects shipping this order.</text><text x="682" y="960" font-family="DM Sans" font-size="15" font-weight="400" fill="#526277">Keep the draft and explain why it was rejected.</text></g></svg>