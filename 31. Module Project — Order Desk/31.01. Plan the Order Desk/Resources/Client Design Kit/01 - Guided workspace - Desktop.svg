<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1720" viewBox="0 0 1440 1720"><g id="01 - Guided workspace - Desktop"><rect x="0" y="0" width="1440" height="1720" rx="0" fill="#F7F6F2" stroke="none"/><rect x="0" y="0" width="1440" height="94" rx="0" fill="#19263A" stroke="none"/><rect x="24" y="22" width="48" height="48" rx="10" fill="#19263A" stroke="#8496B0"/><text x="35" y="52" font-family="Manrope" font-size="18" font-weight="700" fill="white">OD</text><text x="88" y="45" font-family="Manrope" font-size="20" font-weight="700" fill="white">Order Desk</text><text x="88" y="68" font-family="DM Sans" font-size="12" font-weight="400" fill="#D1D9E7">Operations workspace</text><text x="1249" y="51" font-family="DM Sans" font-size="12" font-weight="400" fill="#D1D9E7">Sample workspace</text><text x="48" y="142" font-family="DM Sans" font-size="12" font-weight="700" fill="#526277">FULFILLMENT / ORDER OPERATIONS</text><text x="48" y="196" font-family="Manrope" font-size="40" font-weight="700" fill="#19263A">Ready for the next dispatch.</text><text x="48" y="234" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">Find the right orders, review their readiness and keep the packing team in sync.</text><g id="Active demo session"><rect x="48" y="270" width="1344" height="210" rx="16" fill="white" stroke="#DCE2E8"/><text x="70" y="307" font-family="Manrope" font-size="22" font-weight="700" fill="#19263A">North studio</text><text x="70" y="339" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Local session for practicing private-cache boundaries.</text><text x="70" y="375" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Current session: operator</text><g id="Field - Demo role for the next session"><text x="70" y="404" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Demo role for the next session</text><rect x="70" y="414" width="370" height="44" rx="8" fill="white" stroke="#AEB7C3"/>