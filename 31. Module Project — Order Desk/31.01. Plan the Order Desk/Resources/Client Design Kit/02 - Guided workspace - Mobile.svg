<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1720" viewBox="0 0 390 1720"><g id="02 - Guided workspace - Mobile"><rect x="0" y="0" width="390" height="1720" rx="0" fill="#F7F6F2" stroke="none"/><rect x="0" y="0" width="390" height="94" rx="0" fill="#19263A" stroke="none"/><rect x="24" y="22" width="48" height="48" rx="10" fill="#19263A" stroke="#8496B0"/><text x="35" y="52" font-family="Manrope" font-size="18" font-weight="700" fill="white">OD</text><text x="88" y="45" font-family="Manrope" font-size="20" font-weight="700" fill="white">Order Desk</text><text x="88" y="68" font-family="DM Sans" font-size="12" font-weight="400" fill="#D1D9E7">Operations workspace</text><text x="20" y="136" font-family="DM Sans" font-size="10" font-weight="700" fill="#526277">FULFILLMENT / ORDER OPERATIONS</text><text x="20" y="180" font-family="Manrope" font-size="30" font-weight="700" fill="#19263A">Ready for the</text><text x="20" y="220" font-family="Manrope" font-size="30" font-weight="700" fill="#19263A">next dispatch.</text><text x="20" y="260" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Find the right orders and keep the packing</text><text x="20" y="285" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">team in sync.</text><g id="Active demo session"><rect x="20" y="321" width="350" height="300" rx="16" fill="white" stroke="#DCE2E8"/><text x="42" y="358" font-family="Manrope" font-size="22" font-weight="700" fill="#19263A">North studio</text><text x="42" y="390" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Local session for practicing private-cache</text><text x="42" y="415" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">boundaries.</text><text x="42" y="446" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Current session: operator</text><g id="Field - Demo role for the next session"><text x="42" y="467" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Demo role for the next session</text><rect x="42" y="477" width="306" height="44" rx="8" fill="white" stroke="#AEB7C3"/><text x="54" y="505" font-family="DM Sans" font-size="14" font-weight="400" fill="#19263A">Operator - may change fulfillment</text></g><g id="Button - Open North"><rect x="42" y="542" width="133" height="44" rx="8" fill="#4D3865" stroke="#4D3865"/><text x="70.343" y="570" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Open North</text></g><g id="Button - Open South"><rect x="187" y="542" width="133" height="44" rx="8" fill="#4D3865" stroke="#4D3865"/><text x="214.797" y="570" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Open South</text></g></g><rect x="20" y="641" width="350" height="127" rx="16" fill="white" stroke="#DCE2E8"/><text x="40" y="678" font-family="Manrope" font-size="21" font-weight="700" fill="#19263A">Live order updates</text><g id="Button - Close live connection"><rect x="40" y="699" width="211" height="44" rx="8" fill="white" stroke="#7F8DA3"/><text x="75.381" y="727" font-family="DM Sans" font-size="14" font-weight="600" fill="#1E4C7C">Close live connection</text></g><text x="20" y="804" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">ORDER QUEUE</text><g id="Field - Search orders"><text x="20" y="841" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Search orders</text><rect x="20" y="851" width="350" height="44" rx="8" fill="white" stroke="#AEB7C3"/><text x="32" y="879" font-family="DM Sans" font-size="14" font-weight="400" fill="#19263A"></text></g><g id="Field - Order status"><text x="20" y="925" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Order status</text><rect x="20" y="935" width="350" height="44" rx="8" fill="white" stroke="#AEB7C3"/><text x="32" y="963" font-family="DM Sans" font-size="14" font-weight="400" fill="#19263A">Ready to pack</text></g><g id="Button - Apply filters"><rect x="20" y="996" width="154" height="44" rx="8" fill="#4D3865" stroke="#4D3865"/><text x="57.38" y="1024" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Apply filters</text></g><text x="20" y="1075" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Page 1 - 3 matching orders</text><text x="20" y="1106" font-family="DM Sans" font-size="12" font-weight="400" fill="#526277">Scroll the table horizontally to see all columns.</text><rect x="20" y="1130" width="350" height="210" rx="12" fill="white" stroke="#DCE2E8"/><rect x="21" y="1131" width="348" height="36" rx="12" fill="#F5F7FA" stroke="none"/><text x="42" y="1154" font-family="DM Sans" font-size="10" font-weight="700" fill="#526277">SELECT</text><text x="121" y="1154" font-family="DM Sans" font-size="10" font-weight="700" fill="#526277">ORDER</text><text x="121" y="1200" font-family="DM Sans" font-size="14" font-weight="700" fill="#1E4C7C">OD-1041</text><text x="121" y="1227" font-family="DM Sans" font-size="12" font-weight="400" fill="#526277">Avery Miller</text><rect x="43" y="1191" width="20" height="20" rx="3" fill="#1E4C7C" stroke="none"/><path d="M47 1199 l4 4 l8 -10" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="25" y="1327" width="200" height="5" rx="3" fill="#8496B0" stroke="none"/><text x="121" y="1280" font-family="DM Sans" font-size="14" font-weight="700" fill="#1E4C7C">OD-1043</text><text x="121" y="1307" font-family="DM Sans" font-size="12" font-weight="400" fill="#526277">Casey Reed</text><rect x="43" y="1271" width="20" height="20" rx="3" fill="#1E4C7C" stroke="none"/><path d="M47 1279 l4 4 l8 -10" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="Button - Previous page"><rect x="20" y="1360" width="160" height="44" rx="8" fill="#D8D2DF" stroke="#7F8DA3"/><text x="53.863" y="1388" font-family="DM Sans" font-size="14" font-weight="600" fill="#526277">Previous page</text></g><g id="Button - Next page"><rect x="193" y="1360" width="155" height="44" rx="8" fill="white" stroke="#7F8DA3"/><text x="237.313" y="1388" font-family="DM Sans" font-size="14" font-weight="600" fill="#1E4C7C">Next page</text></g><rect x="20" y="1441" width="350" height="148" rx="16" fill="white" stroke="#DCE2E8"/><rect x="21" y="1442" width="348" height="4" rx="0" fill="#8C275D" stroke="none"/><text x="40" y="1480" font-family="Manrope" font-size="21" font-weight="700" fill="#19263A">Selection</text><text x="40" y="1535" font-family="Manrope" font-size="38" font-weight="700" fill="#19263A">2</text><text x="85" y="1530" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">orders across searches</text></g></svg>