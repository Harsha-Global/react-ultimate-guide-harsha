<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060"><g id="States - Loading recovery and edits"><rect x="0" y="0" width="1280" height="1060" rx="0" fill="#F7F6F2" stroke="none"/><text x="48" y="75" font-family="Manrope" font-size="40" font-weight="700" fill="#19263A">Thoughtful in every state.</text><text x="48" y="114" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">Feedback belongs to the same ShopFront visual system.</text><g id="Loading"><rect x="48" y="164" width="584" height="252" rx="16" fill="white" stroke="#DCE2E8"/><text x="72" y="202" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">LOADING</text><text x="72" y="252" font-family="Manrope" font-size="25" font-weight="700" fill="#19263A">Preparing your collection…</text><text x="72" y="294" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Keep the current view visible during navigation.</text><rect x="72" y="331" width="186" height="46" rx="10" fill="#EDF1F5" stroke="none"/><text x="88" y="360" font-family="DM Sans" font-size="14" font-weight="600" fill="#1E4C7C">Loading…</text></g><g id="No results"><rect x="658" y="164" width="584" height="252" rx="16" fill="white" stroke="#DCE2E8"/><text x="682" y="202" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">NO RESULTS</text><text x="682" y="252" font-family="Manrope" font-size="25" font-weight="700" fill="#19263A">No matching products</text><text x="682" y="294" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">A different search might uncover something good.</text><g id="Explore collection"><rect x="682" y="331" width="186" height="46" rx="10" fill="#1E4C7C" stroke="none"/><text x="706.6" y="360" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Explore collection</text></g></g><g id="Missing product"><rect x="48" y="446" width="584" height="252" rx="16" fill="white" stroke="#DCE2E8"/><text x="72" y="484" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">MISSING PRODUCT</text><text x="72" y="534" font-family="Manrope" font-size="25" font-weight="700" fill="#19263A">Product not found</text><text x="72" y="576" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">It may have been removed from the collection.</text><g id="Back to collection"><rect x="72" y="613" width="186" height="46" rx="10" fill="#1E4C7C" stroke="none"/><text x="96.60000000000001" y="642" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Back to collection</text></g></g><g id="Request failure"><rect x="658" y="446" width="584" height="252" rx="16" fill="white" stroke="#DCE2E8"/><text x="682" y="484" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">REQUEST FAILURE</text><text x="682" y="534" font-family="Manrope" font-size="25" font-weight="700" fill="#19263A">We couldn’t load this page</text><text x="682" y="576" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Check that the local API is running, then try again.</text><g id="Try again"><rect x="682" y="613" width="186" height="46" rx="10" fill="#1E4C7C" stroke="none"/><text x="740.8" y="642" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Try again</text></g></g><g id="Delete confirmation"><rect x="48" y="728" width="584" height="252" rx="16" fill="white" stroke="#DCE2E8"/><text x="72" y="766" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">DELETE CONFIRMATION</text><text x="72" y="816" font-family="Manrope" font-size="25" font-weight="700" fill="#19263A">Remove Trail Backpack?</text><text x="72" y="858" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Saved bags may still refer to this item.</text><g id="Confirm deletion"><rect x="72" y="895" width="186" height="46" rx="10" fill="#1E4C7C" stroke="none"/><text x="104.2" y="924" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Confirm deletion</text></g><g id="Keep product"><rect x="276" y="895" width="150" height="46" rx="10" fill="white" stroke="#7F8DA3"/><text x="305.4" y="924" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Keep product</text></g></g><g id="Unsaved changes"><rect x="658" y="728" width="584" height="252" rx="16" fill="white" stroke="#DCE2E8"/><text x="682" y="766" font-family="DM Sans" font-size="11" font-weight="700" fill="#526277">UNSAVED CHANGES</text><text x="682" y="816" font-family="Manrope" font-size="25" font-weight="700" fill="#19263A">Leave without saving?</text><text x="682" y="858" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Your product changes have not been saved.</text><g id="Keep editing"><rect x="682" y="895" width="186" height="46" rx="10" fill="#1E4C7C" stroke="none"/><text x="729.4" y="924" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Keep editing</text></g><g id="Discard changes and leave"><rect x="886" y="895" width="300" height="46" rx="10" fill="white" stroke="#7F8DA3"/><text x="941.0" y="924" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Discard changes and leave</text></g></g></g></svg>