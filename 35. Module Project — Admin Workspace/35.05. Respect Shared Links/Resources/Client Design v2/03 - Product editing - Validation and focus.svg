<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940"><g id="03 - Product editing - Validation and focus"><rect x="0" y="0" width="1280" height="940" rx="0" fill="#F7F6F2" stroke="none"/><text x="48" y="82" font-family="Manrope" font-size="34" font-weight="700" fill="#19263A">An edit stays with its product.</text><text x="48" y="122" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">The familiar schema and request now sit inside an accessible dialog.</text><rect x="260" y="178" width="760" height="620" rx="22" fill="white" stroke="#DCE2E8"/><text x="294" y="232" font-family="Manrope" font-size="27" font-weight="700" fill="#19263A">Edit Studio Desk Lamp</text><text x="294" y="270" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Update the name and stock. Save submits the draft; Cancel discards it.</text><g id="Field - Product name"><text x="294" y="348" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Product name</text><rect x="294" y="358" width="680" height="44" rx="8" fill="white" stroke="#94A3B8"/><text x="306" y="386" font-family="DM Sans" font-size="14" font-weight="400" fill="#19263A">Everyday Backpack</text></g><text x="294" y="432" font-family="DM Sans" font-size="14" font-weight="600" fill="#9F1239">Another product already uses this name.</text><g id="Field - Stock"><text x="294" y="500" font-family="DM Sans" font-size="14" font-weight="600" fill="#19263A">Stock</text><rect x="294" y="510" width="205" height="44" rx="8" fill="white" stroke="#94A3B8"/><text x="306" y="538" font-family="DM Sans" font-size="14" font-weight="400" fill="#19263A">12</text></g><text x="294" y="583" font-family="DM Sans" font-size="14" font-weight="400" fill="#526277">Whole units, 0-9999.</text><g id="Button - Save product"><rect x="294" y="636" width="180" height="44" rx="9" fill="#1E4C7C" stroke="#1E4C7C"/><text x="339.858" y="664" font-family="DM Sans" font-size="14" font-weight="600" fill="white">Save product</text></g><g id="Button - Cancel edit"><rect x="490" y="636" width="180" height="44" rx="9" fill="white" stroke="#7F8DA3"/><text x="542.83" y="664" font-family="DM Sans" font-size="14" font-weight="600" fill="#1E4C7C">Cancel edit</text></g><text x="294" y="733" font-family="DM Sans" font-size="15" font-weight="400" fill="#526277">The rejected draft stays visible. Focus returns to the field that needs attention.</text><text x="48" y="866" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">Keyboard: focus enters the name field; Tab stays inside. Cancel returns to the row action when it still exists. Escape closes only while no save is</text><text x="48" y="891" font-family="DM Sans" font-size="17" font-weight="400" fill="#526277">pending.</text></g></svg>