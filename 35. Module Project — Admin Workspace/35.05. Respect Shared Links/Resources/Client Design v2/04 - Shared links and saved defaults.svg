<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><g id="04 - Shared links and saved defaults"><rect x="0" y="0" width="1280" height="900" rx="0" fill="#F7F6F2" stroke="none"/><text x="48" y="82" font-family="Manrope" font-size="34" font-weight="700" fill="#19263A">Saved defaults respect a shared link.</text><text x="48" y="127" font-family="DM Sans" font-size="14" font-weight="600" fill="#8C275D">CLIENT CHANGE CR-35-01 / Guided v2</text><rect x="48" y="192" width="574" height="276" rx="16" fill="white" stroke="#DCE2E8"/><text x="72" y="229" font-family="DM Sans" font-size="14" font-weight="600" fill="#8C275D">Address has a view</text><rect x="72" y="249" width="526" height="42" rx="8" fill="#F0F3F8" stroke="none"/><text x="87" y="276" font-family="DM Sans" font-size="16" font-weight="600" fill="#1E4C7C">/?q=travel</text><text x="72" y="339" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">Show the Travel Mug</text><text x="72" y="379" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Keep the explicit URL. Do not overwrite it with the local studio</text><text x="72" y="404" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">snapshot.</text><rect x="658" y="192" width="574" height="276" rx="16" fill="white" stroke="#DCE2E8"/><text x="682" y="229" font-family="DM Sans" font-size="14" font-weight="600" fill="#8C275D">Address has no view</text><rect x="682" y="249" width="526" height="42" rx="8" fill="#F0F3F8" stroke="none"/><text x="697" y="276" font-family="DM Sans" font-size="16" font-weight="600" fill="#1E4C7C">/</text><text x="682" y="339" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">Restore the saved studio view</text><text x="682" y="379" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Write one validated snapshot into the URL once. Start on page one.</text><rect x="48" y="504" width="574" height="276" rx="16" fill="white" stroke="#DCE2E8"/><text x="72" y="541" font-family="DM Sans" font-size="14" font-weight="600" fill="#8C275D">Explicit empty search</text><rect x="72" y="561" width="526" height="42" rx="8" fill="#F0F3F8" stroke="none"/><text x="87" y="588" font-family="DM Sans" font-size="16" font-weight="600" fill="#1E4C7C">/?q=</text><text x="72" y="651" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">Show all products</text><text x="72" y="691" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Presence counts: an empty or invalid managed parameter still</text><text x="72" y="716" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">belongs to the link.</text><rect x="658" y="504" width="574" height="276" rx="16" fill="white" stroke="#DCE2E8"/><text x="682" y="541" font-family="DM Sans" font-size="14" font-weight="600" fill="#8C275D">Later clear or Back</text><rect x="682" y="561" width="526" height="42" rx="8" fill="#F0F3F8" stroke="none"/><text x="697" y="588" font-family="DM Sans" font-size="16" font-weight="600" fill="#1E4C7C">User clears the search</text><text x="682" y="651" font-family="Manrope" font-size="23" font-weight="700" fill="#19263A">Respect the user action</text><text x="682" y="691" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">Do not restore the snapshot again during the same mounted</text><text x="682" y="716" font-family="DM Sans" font-size="16" font-weight="400" fill="#526277">workspace.</text></g></svg>